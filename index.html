<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Берсерк. Герои — Коллекция и Колоды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⚔️ Берсерк. Герои</h1>
        <p>Каталог карт и конструктор колод</p>
    </header>

    <main class="container">
        <!-- Поиск и фильтры -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Поиск карты по названию..." />
            <select id="elementFilter">
                <option value="all">Все стихии</option>
                <option value="Степь">Степь</option>
                <option value="Горы">Горы</option>
                <option value="Лес">Лес</option>
                <option value="Тьма">Тьма</option>
                <option value="Болото">Болото</option>
                <option value="Нейтральная">Нейтральная</option>
            </select>
        </div>

        <!-- Контейнер, куда будут выводиться карточки -->
        <div id="cardsGrid" class="cards-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
